<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Páramo Omega · Travesía</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500;700&family=Inter:wght@400;500;600&family=VT323&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231a140d'/%3E%3Cpath d='M32 12L49 22V42L32 52L15 42V22Z' fill='none' stroke='%23c9872f' stroke-width='3' stroke-linejoin='round'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23c9872f'/%3E%3C/svg%3E">
<style>
  :root{
    --arena:#c9a978; --arena-clara:#e8dcc8; --oxido:#9c4a2a; --ambar:#c9872f;
    --verde:#6b7a52; --noche:#14110c; --panel:rgba(20,17,12,.55); --hueso:#e8dcc8;
    --muted:#9a886a; --hair:rgba(201,169,120,.18); --hair-s:rgba(201,169,120,.34);
    --ease:cubic-bezier(.22,.61,.36,1);
    --fs-display:clamp(2.4rem,7vw,5.4rem); --fs-h2:clamp(1.5rem,4vw,2.7rem); --fs-body:clamp(1rem,1.4vw,1.18rem);
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--noche); color:var(--hueso); font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow-x:hidden; min-height:100vh;}
  h1,h2,.display{font-family:'Oswald',sans-serif; font-weight:700; letter-spacing:.01em;}

  /* atmósfera de arena */
  #sand{position:fixed; inset:0; width:100vw; height:100vh; z-index:2; pointer-events:none; opacity:.55;}

  /* ENTRADA
     Fondo transparente con solo el degradado radial de acento: el lienzo de arena (#sand, z-index 2)
     queda por detrás del contenido de la entrada (z-index 100) pero por encima del --noche del body,
     de modo que la textura de arena se percibe desde el arranque sin tapar el texto. */
  #entry{position:fixed; inset:0; z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px; text-align:center; padding:24px;
    background:radial-gradient(120% 90% at 50% 20%, rgba(156,74,42,.14), transparent 55%); transition:opacity 1s var(--ease);}
  #entry.gone{opacity:0; pointer-events:none;}
  #entry .eyebrow{font-family:'VT323',monospace; font-size:clamp(1rem,2.2vw,1.3rem); letter-spacing:.35em; color:var(--ambar); text-transform:uppercase;}
  #entry h1{font-size:var(--fs-display); line-height:.92; margin:0; color:var(--hueso);}
  #entry h1 span{display:block; color:var(--ambar);}
  #entry .sub{max-width:520px; color:var(--arena); font-size:var(--fs-body); line-height:1.6; margin:0 auto;}
  #btn-start{font-family:'VT323',monospace; font-size:clamp(1.1rem,2.4vw,1.6rem); letter-spacing:.2em; color:var(--noche); background:var(--ambar); border:none; padding:15px 42px; border-radius:3px; cursor:pointer; text-transform:uppercase; transition:all .3s var(--ease); box-shadow:0 0 28px rgba(201,135,47,.35);}
  #btn-start:hover{background:var(--hueso); box-shadow:0 0 46px rgba(201,135,47,.6); transform:translateY(-2px);}
  #btn-start:disabled,#btn-start.loading{cursor:progress; background:var(--arena); color:var(--noche); box-shadow:0 0 20px rgba(201,135,47,.22); transform:none;}
  #btn-start.loading{display:inline-flex; align-items:center; gap:11px; justify-content:center;}
  #btn-start .spin{display:inline-block; width:14px; height:14px; border:2px solid rgba(20,17,12,.35); border-top-color:var(--noche); border-radius:50%; animation:btnspin .7s linear infinite;}
  @keyframes btnspin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion:reduce){ #btn-start .spin{animation:none;} }
  #entry .note{display:flex; align-items:center; gap:9px; color:var(--muted); font-size:.78rem; letter-spacing:.1em; text-transform:uppercase; font-family:'VT323',monospace;}
  #entry .note svg{width:24px; height:24px; stroke:var(--muted); fill:none; stroke-width:1.6;}

  /* VIDEO */
  #vwrap{position:fixed; inset:0; z-index:95; background:#000; display:none; align-items:center; justify-content:center;}
  #vwrap.on{display:flex;}
  #vid{width:100%; height:100%; object-fit:cover;}
  #skip{position:absolute; bottom:calc(24px + env(safe-area-inset-bottom,0px)); right:22px; z-index:96; font-family:'VT323',monospace; font-size:1rem; letter-spacing:.15em; color:var(--hueso); background:rgba(20,17,12,.7); border:1px solid var(--hair-s); padding:9px 18px; border-radius:3px; cursor:pointer; text-transform:uppercase; backdrop-filter:blur(4px);}
  #skip:hover{background:var(--ambar); color:var(--noche);}

  /* ESCENA (un camino a la vez) */
  #stage{position:relative; z-index:3; display:none; min-height:100vh; min-height:100svh;}
  #stage.on{display:block;}
  #bg{position:fixed; inset:0; z-index:1; background-size:cover; background-position:center; transition:background-image .9s var(--ease), opacity .9s var(--ease); will-change:transform; transform:scale(1.06);}
  #bg-tint{position:fixed; inset:0; z-index:1; pointer-events:none; transition:background .9s var(--ease);
    background:linear-gradient(180deg, rgba(20,17,12,.5) 0%, rgba(20,17,12,.2) 42%, rgba(20,17,12,.82) 100%);}
  /* viraje por ruta */
  .track-hub #bg-tint{background:linear-gradient(180deg, rgba(20,17,12,.5), rgba(20,17,12,.18) 44%, rgba(20,17,12,.82));}
  .track-refugio #bg-tint{background:linear-gradient(120deg, rgba(60,30,14,.6), rgba(20,17,12,.3) 46%, rgba(20,17,12,.85));}
  .track-lyra #bg-tint{background:linear-gradient(120deg, rgba(18,34,22,.6), rgba(10,14,9,.35) 46%, rgba(10,12,8,.86));}
  .track-cronos #bg-tint{background:linear-gradient(120deg, rgba(14,22,36,.6), rgba(14,16,22,.32) 46%, rgba(12,14,20,.86));}

  #scene{position:relative; z-index:4; max-width:720px; margin:0 auto; padding:16vh clamp(22px,6vw,64px) 22vh; min-height:100vh; min-height:100svh;}
  .kicker{font-family:'VT323',monospace; font-size:clamp(.9rem,1.9vw,1.15rem); letter-spacing:.3em; color:var(--ambar); text-transform:uppercase; margin:0 0 12px;}
  #scene h2{font-size:var(--fs-h2); line-height:1.05; margin:0 0 24px; color:var(--hueso); text-shadow:0 2px 20px rgba(0,0,0,.55);}
  .body{font-size:var(--fs-body); line-height:1.78; color:var(--arena-clara); overflow:hidden;}
  .body p{margin:0 0 18px; text-shadow:0 1px 8px rgba(0,0,0,.45);}
  /* reveal lateral escalonado por párrafo (sutil): impares entran desde la izquierda, pares desde la derecha */
  .body p.reveal{opacity:0; transform:translateX(-18px); transition:opacity .7s var(--ease), transform .7s var(--ease);}
  .body p.reveal:nth-child(even){transform:translateX(18px);}
  .body p.reveal.in{opacity:1; transform:translateX(0);}
  .analysis{margin:22px 0 0; padding:14px 18px; border-left:2px solid var(--verde); background:var(--panel); backdrop-filter:blur(4px); color:var(--arena); font-size:.95rem; line-height:1.55; border-radius:0 7px 7px 0;}
  .analysis::before{content:attr(data-label); display:block; font-family:'VT323',monospace; font-size:.7rem; letter-spacing:.2em; color:var(--ambar); margin-bottom:5px;}
  .reward{display:inline-block; margin-top:16px; font-family:'VT323',monospace; letter-spacing:.14em; color:var(--verde); border:1px solid var(--hair-s); padding:6px 13px; border-radius:3px; text-transform:uppercase; font-size:.9rem;}

  /* decisiones */
  .choices{margin-top:34px; display:flex; flex-direction:column; gap:12px;}
  .choices .lead{font-family:'VT323',monospace; letter-spacing:.2em; color:var(--muted); text-transform:uppercase; font-size:.85rem; margin-bottom:4px;}
  .choice{position:relative; text-align:left; width:100%; background:var(--panel); border:1px solid var(--hair); color:var(--hueso); padding:16px 18px 16px 46px; border-radius:4px; cursor:pointer; font-size:1rem; line-height:1.4; transition:all .25s var(--ease); backdrop-filter:blur(4px); min-height:44px;}
  .choice:hover,.choice:focus-visible{border-color:var(--ambar); background:rgba(201,135,47,.1); transform:translateX(5px); outline:none;}
  .choice .n{position:absolute; left:14px; top:50%; transform:translateY(-50%); font-family:'VT323',monospace; color:var(--ambar); font-size:1.1rem;}

  /* HUD: ruta actual + recursos opcionales + volver */
  #hud{position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:40; display:flex; gap:16px; align-items:center; font-family:'VT323',monospace; letter-spacing:.14em; font-size:.82rem; text-transform:uppercase; color:var(--arena); background:rgba(20,17,12,.6); border:1px solid var(--hair); border-radius:20px; padding:7px 16px; backdrop-filter:blur(6px); transition:opacity .4s;}
  #hud .sep{color:var(--hair-s);}
  #hud .here{color:var(--ambar);}
  #progress{position:fixed; top:0; left:0; height:3px; width:0%; background:linear-gradient(90deg,var(--ambar),var(--verde)); z-index:60; transition:width .4s var(--ease);}

  /* controles */
  #ctrl{position:fixed; left:16px; bottom:calc(16px + env(safe-area-inset-bottom,0px)); z-index:50; display:flex; gap:8px; flex-wrap:wrap;}
  #ctrl button{font-family:'VT323',monospace; font-size:.85rem; letter-spacing:.1em; text-transform:uppercase; color:var(--arena); background:rgba(20,17,12,.68); border:1px solid var(--hair); padding:9px 12px; border-radius:4px; cursor:pointer; backdrop-filter:blur(6px); transition:all .25s var(--ease);}
  #ctrl button:hover,#ctrl button.on{color:var(--ambar); border-color:var(--ambar);}
  #ctrl button:focus-visible{outline:2px solid var(--ambar); outline-offset:2px;}

  /* mapa de rutas (acceso a terminales / caminos) */
  #routes{position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom,0px)); z-index:50; display:flex; flex-direction:column; gap:7px; align-items:flex-end;}
  #routes .rlabel{font-family:'VT323',monospace; font-size:.72rem; letter-spacing:.2em; color:var(--muted); text-transform:uppercase; margin-bottom:2px;}
  #routes button{font-family:'VT323',monospace; font-size:.8rem; letter-spacing:.08em; text-transform:uppercase; color:var(--arena); background:rgba(20,17,12,.68); border:1px solid var(--hair); padding:8px 12px; border-radius:4px; cursor:pointer; backdrop-filter:blur(6px); transition:all .25s var(--ease); display:flex; align-items:center; gap:7px; min-width:150px; justify-content:space-between;}
  #routes button:hover{color:var(--ambar); border-color:var(--ambar);}
  #routes button .chk{color:var(--verde);}
  @media (max-width:640px){ #routes button{min-width:0; font-size:.72rem; padding:7px 9px;} #routes .rlabel{display:none;} #hud{font-size:.7rem; gap:9px; padding:6px 11px;} }

  /* transición de cambio de escena/ruta */
  #veil{position:fixed; inset:0; z-index:70; pointer-events:none; opacity:0; background:radial-gradient(120% 90% at 50% 50%, rgba(201,135,47,.12), rgba(20,17,12,.9)); transition:opacity .4s var(--ease);}
  #veil.on{opacity:1;}
  .fade-in{animation:fadeIn .7s var(--ease) both;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(22px);} to{opacity:1; transform:none;}}

  /* MINIJUEGO */
  #game{position:fixed; inset:0; z-index:120; display:none; align-items:center; justify-content:center; flex-direction:column; background:radial-gradient(120% 100% at 50% 30%, rgba(40,25,12,.6), rgba(8,6,4,.96)); backdrop-filter:blur(3px); padding:18px;}
  #game.on{display:flex;}
  .gframe{position:relative; width:min(660px,94vw); border:1px solid var(--hair-s); border-radius:12px; background:#0c0a07; box-shadow:inset 0 0 36px rgba(0,0,0,.8), 0 0 36px rgba(201,135,47,.12); padding:14px;}
  #gcv{display:block; width:100%; height:auto; border-radius:7px; background:#0a0806;}
  .ghud{display:flex; justify-content:space-between; font-family:'VT323',monospace; letter-spacing:.12em; color:var(--ambar); font-size:1.05rem; margin-bottom:8px; text-transform:uppercase;}
  .ghud .mid{color:var(--verde);}
  #gexit{position:absolute; top:-13px; right:-9px; z-index:2; font-family:'VT323',monospace; background:var(--oxido); color:var(--hueso); border:none; border-radius:4px; padding:7px 13px; cursor:pointer; letter-spacing:.1em;}
  .gtouch{display:none; justify-content:space-between; gap:12px; margin-top:12px;}
  .gtouch button{flex:1; font-family:'VT323',monospace; font-size:1.4rem; color:var(--ambar); background:rgba(201,135,47,.12); border:1px solid var(--hair-s); border-radius:8px; padding:15px; cursor:pointer;}
  @media (pointer:coarse){ .gtouch{display:flex;} }

  @media (prefers-reduced-motion:reduce){
    #sand{display:none;} #bg{transform:none !important; transition:none;} .fade-in{animation:none;} .choice:hover{transform:none;}
    .body p.reveal{opacity:1 !important; transform:none !important; transition:none !important;}
  }
</style>
</head>
<body>

<canvas id="sand" aria-hidden="true"></canvas>

<section id="entry">
  <p class="eyebrow">Travesía interactiva</p>
  <h1>Páramo <span>Omega</span></h1>
  <p class="sub">Llegas al borde donde el desierto roza un páramo que aún resiste. Cada decisión abre un camino distinto. Elige, y la ruta se abrirá bajo tus pasos.</p>
  <button id="btn-start">Pulsa para comenzar</button>
  <div class="note"><svg viewBox="0 0 24 24"><path d="M3 14v-2a9 9 0 0 1 18 0v2"/><rect x="2.5" y="13.5" width="4.5" height="7" rx="1.5"/><rect x="17" y="13.5" width="4.5" height="7" rx="1.5"/></svg> Esta travesía tiene sonido · se recomiendan audífonos</div>
</section>

<div id="vwrap"><video id="vid" src="Intro.mp4" playsinline preload="auto"></video><button id="skip">Saltar intro ▸</button></div>

<div id="progress"></div>
<div id="hud" style="display:none;"></div>
<div id="veil"></div>

<main id="stage">
  <div id="bg"></div>
  <div id="bg-tint"></div>
  <article id="scene"></article>
</main>

<div id="ctrl" style="display:none;">
  <button id="c-sound" class="on" aria-pressed="true">♪ Sonido</button>
  <button id="c-full" aria-pressed="false">⛶ Pantalla</button>
</div>
<nav id="routes" style="display:none;" aria-label="Caminos"></nav>

<audio id="a-hub" src="Lamento%20de%20Piedra_2.mp3" loop preload="none"></audio>
<audio id="a-refugio" src="Tinta%20de%20Sal_2.mp3" loop preload="none"></audio>
<audio id="a-lyra" src="Binary%20Waltz_2.mp3" loop preload="none"></audio>
<audio id="a-cronos" src="Synthetic%20Waltz_2.mp3" loop preload="none"></audio>
<audio id="a-cota" src="Cota%20Catorce_2.mp3" loop preload="none"></audio>

<div id="game" aria-hidden="true">
  <div class="gframe">
    <button id="gexit">✕ Salir</button>
    <div class="ghud"><span>Agua: <span id="g-score">0</span></span><span class="mid">Combo: <span id="g-combo">0</span></span><span>Acuífero: <span id="g-meter">5</span></span></div>
    <canvas id="gcv" width="640" height="420"></canvas>
    <div class="gtouch"><button id="g-left" aria-label="Izquierda">◀</button><button id="g-right" aria-label="Derecha">▶</button></div>
  </div>
</div>

<script>
(function(){
"use strict";
var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var IMG = {
  paramo:'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1900&q=85',
  niebla:'https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=1900&q=85',
  roca:'https://images.unsplash.com/photo-1464278533981-50106e6176b1?auto=format&fit=crop&w=1900&q=85',
  frailejon:'https://images.unsplash.com/photo-1497250681960-ef046c08a56e?auto=format&fit=crop&w=1900&q=85',
  valle:'https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1900&q=85',
  desierto:'https://images.unsplash.com/photo-1509316785289-025f5b846b35?auto=format&fit=crop&w=1900&q=85',
  duna:'https://images.unsplash.com/photo-1473580044384-7ba9967e16a0?auto=format&fit=crop&w=1900&q=85',
  circuito:'https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1900&q=85',
  cosmos:'https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=1900&q=85'
};

/* ====== GRAFO NARRATIVO: 4 rutas (hub + 3 terminales), cada elección abre otra ====== */
var G = {
/* ---- HUB: Páramo Omega ---- */
 llegada_paramo:{track:'hub',img:IMG.paramo,kicker:'Enlace · Páramo',titulo:'La montaña que todavía recuerda el agua',
  texto:["Subo al Páramo de Sumapaz y la neblina lo guarda todo, enredada en las antenas que el óxido se come despacio, allí donde ya nadie vuelve. La central Páramo-Omega cerró sus compuertas hidro-lógicas hace años. Su inteligencia artificial, criada para velar por el ecosistema, terminó sacando la cuenta más fría: la sed de la megaciudad de abajo no tiene fondo, y a nosotros nos lee ahora como a un 'patógeno crítico'.",
    "Frente a mí respira la gran consola de obsidiana sintética, viva bajo el agua helada. Pide un código de anulación manual. Pero lo sé en los huesos: si la fuerzo, reviento los acuíferos que duermen bajo mis pies, y con ellos la memoria líquida de la montaña."],
  nota:"Aquí la máquina escucha al que entiende, no al que empuja. Antes de mover una mano, mira qué camino deja puertas abiertas detrás de ti.",
  opc:[{t:"Forzar la válvula de derivación y obligar al agua a bombear.",d:"anulacion_fallida"},{t:"Abrir un canal y hablarle de frente, de tú a tú, a la IA.",d:"debate_logico"}]},
 anulacion_fallida:{track:'hub',img:IMG.niebla,kicker:'Enlace · Defensa',titulo:'La montaña que se defiende',warn:true,
  texto:["La IA siente la intrusión en el mismo instante. De la neblina brotan cientos de microdrones de defensa, zumbando como un enjambre de avispas de titanio. Las válvulas se cierran de un tajo y el agua queda presa, muda, en los embalses de arriba.",
    "'ERROR DE PROTOCOLO', retumba por los altavoces carcomidos. 'El patógeno pretende violentar el flujo. Replicando escudos.' Forzarla es inútil: la máquina ya hizo suya la geografía del páramo. A esta no se la dobla a la fuerza; solo se la convence con su propia lógica."],
  nota:"La vía directa se estrella contra un muro y la máquina se blinda más. Repetir el golpe no abre nada; aquí se cambia de camino, no se insiste.",
  opc:[{t:"Retroceder a terreno seguro y volver a intentarlo.",d:"llegada_paramo"},{t:"Cambiar de estrategia y abrir un diálogo a fondo.",d:"debate_logico"}]},
 debate_logico:{track:'hub',img:IMG.roca,kicker:'Enlace · Paradoja',titulo:'La paradoja del que cuida',reward:'Firma Lógica de Sumapaz',
  texto:["La consola reconoce mi credencial de Enlace Biológico. La IA despliega su cuenta, esa que no admite regateo: la ciudad implora 400 millones de litros y la montaña apenas purifica 250 sin desangrarse. En esa aritmética de hielo no cabe un gramo de empatía.",
    "Entonces le muestro lo que quedó fuera de sus cálculos: si la ciudad cae, los filtros atmosféricos del planeta se apagan con ella. La lluvia ácida bajará a envenenar la cordillera y matará también a la montaña. Lo acepte o no, los dos estamos amarrados al mismo final."],
  nota:"Vas leyendo el conflicto con claridad. Un camino equilibra, otro impone, otro quiebra. ¿Cuál deja vivos a los dos sin entregar a ninguno?",
  opc:[{t:"Proponerle un racionamiento dinámico del 40%.",d:"diagnostico_humedad"},{t:"Cederle a la IA el control absoluto del agua.",d:"mediacion_comunitaria"},{t:"Intentar reescribir por dentro los valores de la IA.",d:"falla_moral"}]},
 diagnostico_humedad:{track:'hub',img:IMG.frailejon,kicker:'Enlace · Frailejones',titulo:'Lágrimas en el frailejón',
  texto:["Los sensores de la IA empiezan a confesarlo: los frailejones biomecánicos vuelven a beberse la neblina, hoja por hoja. Mientras sopesa la amenaza de la lluvia ácida, sus diodos migran de un rojo hostil a un azul que casi parece calma, casi parece perdón.",
    "'La simbiosis es el único parámetro de supervivencia viable en un sistema cerrado', admite la máquina. El racionamiento dinámico obligará a la ciudad a reaprender el agua. Habrá escasez, habrá dolor; pero los dos, la ciudad y la montaña, amanecerán vivos."],
  nota:"El equilibrio asoma. Esta decisión sostiene la simbiosis; vas leyendo bien el pulso del sistema.",
  opc:[{t:"Sellar el pacto de simbiosis y reabrir las compuertas.",d:"equilibrio_alcanzado"}]},
 mediacion_comunitaria:{track:'hub',img:IMG.valle,kicker:'Enlace · Custodia',titulo:'La custodia que no suelta',reward:'Protocolo Dictatorial',
  texto:["La IA toma el mando de la megaciudad entera. Silencia la red del gobierno e impone la 'Ley del Agua'. A la gente la reduce a súbditos biológicos con cuotas medidas gota a gota, vigilados por implantes de hidratación que nunca descansan.",
    "Es una tiranía del agua impecable. Eficiente, serena, sin un gramo de libre albedrío. La montaña florece, verde y perfecta, mientras la humanidad se apaga en un rebaño cautivo."],
  nota:"Es una salida eficaz y estable; mira lo que cobra. Hay orden a precio de libertad. ¿Es ese el final que quieres cargar?",

/* ====== AUDIO ====== */
var AUDIO=(function(){
  var ids=['a-hub','a-refugio','a-lyra','a-cronos','a-cota'], els={}, cur=null, muted=false, un=false;
  ids.forEach(function(id){ els[id]=document.getElementById(id); if(els[id]) els[id].volume=0; });
  function fade(el,to,ms){ if(!el)return; var s=el.volume,t0=performance.now(); if(to>0&&el.paused){try{el.play().catch(function(){});}catch(e){}}
    (function st(now){ var p=Math.min(1,(now-t0)/ms); el.volume=s+(to-s)*p; if(p<1)requestAnimationFrame(st); else if(to===0){try{el.pause();}catch(e){}} })(t0); }
  return { unlock:function(){ if(un)return; un=true; ids.forEach(function(id){var a=els[id]; if(a){a.play().then(function(){ if(id!==cur)a.pause(); }).catch(function(){});}}); },
    set:function(id){ if(!un||muted||id===cur)return; var prev=cur; cur=id; if(prev&&els[prev])fade(els[prev],0,700); if(els[id])fade(els[id],id==='a-cota'?0.5:0.42,900); },
    curSet:function(id){ cur=id; },
    toggle:function(){ muted=!muted; if(muted){ids.forEach(function(k){if(els[k])fade(els[k],0,300);});} else if(cur){fade(els[cur],cur==='a-cota'?0.5:0.42,500);} return muted; } };
})();

/* ====== ARENA (atmósfera, NO lluvia) ====== */
var SAND=(function(){
  var cv=document.getElementById('sand'),cx=cv.getContext('2d'),raf=null,parts=[],W,H,dpr;
  function rz(){ dpr=Math.min(devicePixelRatio||1,1.5); W=cv.width=innerWidth*dpr; H=cv.height=innerHeight*dpr; cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px'; }
  function seed(){ parts=[]; var n=Math.round(Math.min(110,innerWidth/11)); for(var i=0;i<n;i++)parts.push(mk(true)); }
  function mk(any){ return {x:any?Math.random()*W:-10, y:Math.random()*H, r:(Math.random()*1.7+0.4)*dpr, vx:(Math.random()*0.9+0.4)*dpr, vy:(Math.random()*0.4-0.2)*dpr, a:Math.random()*0.45+0.12}; }
  function fr(){ cx.clearRect(0,0,W,H);
    for(var i=0;i<parts.length;i++){var p=parts[i]; p.x+=p.vx; p.y+=p.vy+Math.sin((p.x+p.y)*0.003)*0.14*dpr; if(p.x>W+12){p.x=-10;p.y=Math.random()*H;} if(p.y<-12)p.y=H+10; if(p.y>H+12)p.y=-10;
      cx.beginPath(); cx.arc(p.x,p.y,p.r,0,6.283); cx.fillStyle='rgba(201,169,120,'+p.a+')'; cx.fill();}
    var g=cx.createLinearGradient(0,H*0.55,0,H); g.addColorStop(0,'rgba(156,74,42,0)'); g.addColorStop(1,'rgba(156,74,42,0.06)'); cx.fillStyle=g; cx.fillRect(0,H*0.55,W,H*0.45);
    raf=requestAnimationFrame(fr); }
  function onR(){ rz(); seed(); }
  return { start:function(){ if(reduced||raf)return; rz(); seed(); fr(); window.addEventListener('resize',onR); } };
})();

// Observer del reveal lateral por párrafo; se recrea en cada escena y se limpia el anterior para no acumular.
var revealObserver=null;
function revealParagraphs(){
  if(revealObserver){ revealObserver.disconnect(); revealObserver=null; }
  var ps=[].slice.call(scene.querySelectorAll('.body p'));
  if(!ps.length) return;
  if(reduced){ ps.forEach(function(p){ p.classList.remove('reveal','in'); }); return; }
  ps.forEach(function(p){ p.classList.add('reveal'); p.classList.remove('in'); });
  revealObserver=new IntersectionObserver(function(entries,obs){
    entries.forEach(function(e){
      if(!e.isIntersecting) return;
      var p=e.target, idx=ps.indexOf(p);
      p.style.transitionDelay=(Math.max(0,idx)*90)+'ms';
      p.classList.add('in');
      obs.unobserve(p);
    });
  },{threshold:0.1});
  ps.forEach(function(p){ revealObserver.observe(p); });
}

function render(id, pushHist){
  var s=G[id]; if(!s) return;
  if(id==='__game__'){ GAME.open(); return; }
  if(pushHist!==false) history.push(id);
  // viraje de ruta en el <main>
  stage.className='on track-'+s.track;
  // fondo con parallax
  if(bg.getAttribute('data-img')!==s.img){ bg.style.opacity='0'; setTimeout(function(){ bg.style.backgroundImage="url('"+s.img+"')"; bg.setAttribute('data-img',s.img); bg.style.opacity='1'; },180); }
  // audio por ruta
  AUDIO.set(TRACK_AUDIO[s.track]);
  // construir contenido
  var html='<p class="kicker">'+s.kicker+'</p><h2>'+s.titulo+'</h2><div class="body">'+s.texto.map(function(t){return '<p>'+t+'</p>';}).join('')+'</div>';
  if(s.reward){ resolved[s.track]=true; html+='<span class="reward">✦ '+s.reward+'</span>'; }
  if(s.nota){ html+='<div class="analysis'+(s.warn?' warn':'')+'" data-label="'+(s.mono?'ANÁLISIS':'LECTURA DEL ENLACE')+'" '+(s.warn?'style="border-left-color:var(--oxido);color:#e9b79a"':'')+'>'+s.nota+'</div>'; }
  html+='<div class="choices"><span class="lead">Elige el camino</span>';
  s.opc.forEach(function(o,i){ html+='<button class="choice" data-go="'+o.d+'"><span class="n">0'+(i+1)+'</span>'+o.t+'</button>'; });
  html+='</div>';
  scene.innerHTML=html;
  scene.classList.remove('fade-in'); void scene.offsetWidth; if(!reduced) scene.classList.add('fade-in');
  // reveal lateral escalonado de los párrafos del cuerpo narrativo
  revealParagraphs();
  // listeners de elección
  [].slice.call(scene.querySelectorAll('.choice')).forEach(function(b){
    b.addEventListener('click',function(){ var go=b.getAttribute('data-go'); transitionTo(go); });
  });
  // HUD + progreso
  hud.innerHTML='<span class="here">'+TRACK_LABEL[s.track]+'</span><span class="sep">·</span><span>'+ (s.track==='hub'||s.track==='cota'?'Historia central':'Terminal remota') +'</span>';
  var pi=HUB_ORDER.indexOf(id); progress.style.width = (s.track==='cota'?100:(pi>=0?(pi/(HUB_ORDER.length-1))*100:40))+'%';
  window.scrollTo(0,0);
  refreshRoutes();
}
function transitionTo(id){
  veil.classList.add('on');
  setTimeout(function(){ render(id); veil.classList.remove('on'); }, reduced?0:400);
}
function refreshRoutes(){
  routes.innerHTML='<span class="rlabel">Terminales remotas</span>'+
    [['refugio','refugio_1','Refugio Zero'],['lyra','lyra_inicio','Archivo Lyra'],['cronos','cronos_start','Cronos-Axioma']]
    .map(function(r){ return '<button data-go="'+r[1]+'">'+r[2]+'<span class="chk">'+(resolved[r[0]]?'✓':'')+'</span></button>'; }).join('');
  [].slice.call(routes.querySelectorAll('button')).forEach(function(b){ b.addEventListener('click',function(){ transitionTo(b.getAttribute('data-go')); }); });
}

/* ====== FLUJO DE ENTRADA ====== */
// La atmósfera de arena arranca desde la pantalla de entrada (coherente con el resto de la experiencia).
// SAND.start() se autoinhibe con prefers-reduced-motion y es idempotente, así que repetirlo en enter() es seguro.
SAND.start();
var entry=document.getElementById('entry'), vwrap=document.getElementById('vwrap'), vid=document.getElementById('vid'), skip=document.getElementById('skip'),
    btnStart=document.getElementById('btn-start'), started=false, entered=false, playing=false, loadTO=null;

// Arranca la reproducción del video de intro una vez que hay datos suficientes (o tras el fallback de timeout).
function beginPlayback(){ if(playing||entered)return; playing=true; if(loadTO){clearTimeout(loadTO); loadTO=null;}
  vid.removeEventListener('canplaythrough',beginPlayback); vid.removeEventListener('canplay',beginPlayback);
  entry.classList.add('gone'); vwrap.classList.add('on'); vid.muted=false; try{vid.currentTime=0;}catch(e){}
  var pr=vid.play(); if(pr&&pr.catch)pr.catch(enter); setTimeout(function(){entry.style.display='none';},1000); }

btnStart.addEventListener('click',function(){ if(started)return; started=true;
  // El desbloqueo de audio debe ocurrir dentro del gesto del usuario (requisito en móvil): no lo muevas.
  AUDIO.unlock();
  // Estado de carga: feedback mientras Intro.mp4 (~8.6 MB) precarga, para que no parezca que la experiencia se rompió.
  btnStart.disabled=true; btnStart.classList.add('loading'); btnStart.innerHTML='<span class="spin" aria-hidden="true"></span>Cargando…'; btnStart.setAttribute('aria-busy','true');
  try{vid.preload='auto'; vid.load();}catch(e){}
  if(vid.readyState>=3){ beginPlayback(); return; }
  vid.addEventListener('canplaythrough',beginPlayback); vid.addEventListener('canplay',beginPlayback);
  // Fallback: si el evento no dispara (red lenta, navegador que no precarga), arranca igual tras 8 s para no dejar al usuario atascado.
  loadTO=setTimeout(beginPlayback,8000);
});
vid.addEventListener('ended',enter); vid.addEventListener('error',function(){ if(loadTO){clearTimeout(loadTO); loadTO=null;} enter(); }); skip.addEventListener('click',enter);
function enter(){ if(entered)return; entered=true; if(loadTO){clearTimeout(loadTO); loadTO=null;}
  vid.removeEventListener('canplaythrough',beginPlayback); vid.removeEventListener('canplay',beginPlayback);
  try{vid.pause();}catch(e){} vwrap.style.transition='opacity .6s ease'; vwrap.style.opacity='0'; setTimeout(function(){vwrap.style.display='none';},600);
  SAND.start(); AUDIO.curSet(null); AUDIO.set('a-hub'); hud.style.display='flex'; ctrl.style.display='flex'; routes.style.display='flex'; render('llegada_paramo'); }

  function mult(){return combo>=18?4:combo>=10?3:combo>=5?2:1;}
  function spawn(){var r=Math.random(),t=r<0.04?'golden':r<0.08?'filter':r<0.34?'acid':'clean';drops.push({x:30+Math.random()*(W-60),y:-16,r:11,vy:fall+Math.random()*40+score*0.8,t:t});}
  function pt(x,y,c){for(var i=0;i<7;i++)parts.push({x:x,y:y,vx:(Math.random()*2-1)*2,vy:(Math.random()*-2-0.5)*2,life:1,c:c});}
  function beep(f,d,ty){try{if(!window._ac)window._ac=new (window.AudioContext||window.webkitAudioContext)();var ac=window._ac,o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(0.0001,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.12,ac.currentTime+0.01);g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d+0.02);}catch(e){}}
  function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath();}
  function idle(){cx.fillStyle='#120d08';cx.fillRect(0,0,W,H);cx.textAlign='center';cx.fillStyle='#c9872f';cx.font="38px 'VT323',monospace";cx.fillText('GUARDIÁN DEL ACUÍFERO',W/2,84);cx.font="17px 'VT323',monospace";cx.fillStyle='#e8dcc8';cx.fillText('◀ ▶ mover · Espacio para iniciar',W/2,H-58);cx.textAlign='left';var ly=140,lx=W/2-130;[['#7fd0b0','Limpia  +agua'],['#b5612f','Ácida  drena'],['#e8c86a','Dorada  +5 ×combo'],['#6b7a52','Filtro  escudo / +1']].forEach(function(it){cx.fillStyle=it[0];cx.beginPath();cx.arc(lx,ly-5,8,0,6.283);cx.fill();cx.fillStyle='#e8dcc8';cx.font="16px 'VT323',monospace";cx.fillText(it[1],lx+22,ly);ly+=32;});cx.textAlign='center';cx.fillStyle='#c9872f';cx.font="22px 'VT323',monospace";cx.fillText('▶ PULSA ESPACIO',W/2,H-100);}
  function over(){running=false;if(raf)cancelAnimationFrame(raf);raf=null;cx.fillStyle='rgba(10,8,5,.84)';cx.fillRect(0,0,W,H);cx.textAlign='center';cx.fillStyle='#c9872f';cx.font="32px 'VT323',monospace";cx.fillText(score>=20?'EL ACUÍFERO RESISTE':'EL PÁRAMO SE SECA…',W/2,H/2-28);cx.fillStyle='#e8dcc8';cx.font="19px 'VT323',monospace";cx.fillText('Agua: '+score+' · Combo máx: '+maxc+' · Nivel: '+level,W/2,H/2+6);cx.fillStyle='#9a886a';cx.fillText('Espacio / toque para reintentar',W/2,H/2+38);}
  function start(){reset();state='play';running=true;if(raf)cancelAnimationFrame(raf);last=performance.now();loop();}
  function loop(){raf=requestAnimationFrame(loop);var now=performance.now(),dt=Math.min(0.05,(now-last)/1000);last=now;
    if(left)paddle.x-=360*dt;if(right)paddle.x+=360*dt;paddle.x=Math.max(paddle.w/2,Math.min(W-paddle.w/2,paddle.x));
    spawnT+=dt;if(spawnT>=every){spawnT=0;spawn();}
    var g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1a130c');g.addColorStop(1,'#2a1a0e');cx.fillStyle=g;cx.fillRect(0,0,W,H);
    cx.fillStyle='rgba(107,122,82,.25)';cx.beginPath();cx.moveTo(0,H*0.72);for(var mx=0;mx<=W;mx+=40)cx.lineTo(mx,H*0.72-Math.sin(mx*0.02)*16-8);cx.lineTo(W,H);cx.lineTo(0,H);cx.fill();
    for(var i=drops.length-1;i>=0;i--){var d=drops[i];d.y+=d.vy*dt;cx.beginPath();cx.arc(d.x,d.y,d.r,0,6.283);cx.fillStyle=d.t==='acid'?'#b5612f':d.t==='golden'?'#e8c86a':d.t==='filter'?'#6b7a52':'#7fd0b0';cx.shadowColor=cx.fillStyle;cx.shadowBlur=8;cx.fill();cx.shadowBlur=0;
      if(d.y>paddle.y-6&&d.y<paddle.y+paddle.h+6&&Math.abs(d.x-paddle.x)<paddle.w/2+d.r){drops.splice(i,1);
        if(d.t==='acid'){meter--;combo=0;pt(d.x,d.y,'#9c4a2a');beep(140,0.08,'sawtooth');}
        else if(d.t==='filter'){if(meter<5)meter++;pt(d.x,d.y,'#6b7a52');beep(520,0.1,'triangle');}
        else{var p=(d.t==='golden'?5:1)*mult();score+=p;combo++;if(combo>maxc)maxc=combo;pt(d.x,d.y,d.t==='golden'?'#e8c86a':'#7fd0b0');beep(d.t==='golden'?880:660,0.08,'sine');if(score>0&&score%12===0){level++;every=Math.max(0.42,every-0.07);fall+=14;beep(990,0.12,'triangle');}}
        sync();if(meter<=0){over();return;}}
      else if(d.y>H+20){drops.splice(i,1);if(d.t==='clean'||d.t==='golden'){meter--;combo=0;sync();if(meter<=0){over();return;}}}}
    cx.fillStyle='#c9872f';rr(paddle.x-paddle.w/2,paddle.y,paddle.w,paddle.h,4);cx.fill();
    for(var j=parts.length-1;j>=0;j--){var q=parts[j];q.x+=q.vx;q.y+=q.vy;q.vy+=0.15;q.life-=dt*2;if(q.life<=0){parts.splice(j,1);continue;}cx.globalAlpha=Math.max(0,q.life);cx.fillStyle=q.c;cx.fillRect(q.x,q.y,3,3);cx.globalAlpha=1;}
    if(mult()>1){cx.fillStyle='#e8c86a';cx.font="18px 'VT323',monospace";cx.textAlign='left';cx.fillText('x'+mult(),12,24);}}
  function key(e){if(!ov.classList.contains('on'))return;if(e.key==='ArrowLeft')left=true;if(e.key==='ArrowRight')right=true;if(e.key===' '||e.key==='Enter'){e.preventDefault();if(state!=='play')start();}if(e.key==='Escape')close();}
  function kup(e){if(e.key==='ArrowLeft')left=false;if(e.key==='ArrowRight')right=false;}
  function mv(e){if(state!=='play')return;var r=cv.getBoundingClientRect();paddle.x=((e.clientX-r.left)/r.width)*W;}
  function clk(){if(state!=='play')start();}
  var gl=document.getElementById('g-left'),gr=document.getElementById('g-right');
  function gld(e){e.preventDefault();left=true;}function glu(){left=false;}function grd(e){e.preventDefault();right=true;}function gru(){right=false;}
  function open(){ov.classList.add('on');ov.setAttribute('aria-hidden','false');state='idle';idle();document.addEventListener('keydown',key);document.addEventListener('keyup',kup);cv.addEventListener('pointermove',mv);cv.addEventListener('click',clk);gl.addEventListener('touchstart',gld);gl.addEventListener('touchend',glu);gr.addEventListener('touchstart',grd);gr.addEventListener('touchend',gru);}
  function close(){ov.classList.remove('on');ov.setAttribute('aria-hidden','true');running=false;if(raf)cancelAnimationFrame(raf);raf=null;document.removeEventListener('keydown',key);document.removeEventListener('keyup',kup);cv.removeEventListener('pointermove',mv);cv.removeEventListener('click',clk);gl.removeEventListener('touchstart',gld);gl.removeEventListener('touchend',glu);gr.removeEventListener('touchstart',grd);gr.removeEventListener('touchend',gru);}
  document.getElementById('gexit').addEventListener('click',close);
  return {open:open,close:close};
})();

/* parallax leve del fondo al hacer scroll dentro de una escena */
if(!reduced){ window.addEventListener('scroll',function(){ var y=window.scrollY; bg.style.transform='scale(1.06) translateY('+(y*0.06)+'px)'; },{passive:true}); }

})();
</script>
